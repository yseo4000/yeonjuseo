<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="세상의 모든 귀여운 강아지와 고양이를 만나보세요!">
    <title>오늘의 귀여움 🐾</title>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #2d3436;
            --text-sub: #636e72;
            --accent-dog: #ff7675;
            --accent-cat: #74b9ff;
            --accent-random: #55efc4;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-top: 20px;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.95rem;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #f7f9fc;
            border-radius: 16px;
            overflow: hidden;
            display: grid;
            place-items: center;
        }

        #pet-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        #pet-image.loaded {
            opacity: 1;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #f7f9fc;
            color: var(--text-sub);
            font-size: 0.9rem;
            z-index: 1;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: var(--accent-random);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-random {
            grid-column: span 2;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: white;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-dog { background-color: var(--accent-dog); }
        .btn-dog:hover { background-color: #ff5e5d; }

        .btn-cat { background-color: var(--accent-cat); }
        .btn-cat:hover { background-color: #5ba7f8; }

        .btn-random { background-color: var(--text-main); }
        .btn-random:hover { background-color: #1a1e21; }

        footer {
            margin-top: auto;
            padding: 30px 0;
            font-size: 0.85rem;
            color: var(--text-sub);
            text-align: center;
        }

        @media (max-width: 480px) {
            header h1 { font-size: 1.6rem; }
            .main-container { padding: 16px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>오늘의 귀여움 🐾</h1>
        <p>당신의 하루를 행복하게 채워줄 친구들을 만나보세요.</p>
    </header>

    <main class="main-container">
        <div class="image-wrapper">
            <div id="loading" class="loading-overlay">
                <div class="spinner"></div>
                <p>귀여움 충전 중...</p>
            </div>
            <img id="pet-image" alt="귀여운 동물 사진">
        </div>

        <div class="controls">
            <button class="btn-dog" onclick="loadPet('dog')"><span>🐶</span> 강아지</button>
            <button class="btn-cat" onclick="loadPet('cat')"><span>🐱</span> 고양이</button>
            <button class="btn-random" onclick="loadPet('random')"><span>✨</span> 아무나 좋아!</button>
        </div>
    </main>

    <footer>
        <p>© 2026 오늘의 귀여움. 즐거운 하루 되세요!</p>
    </footer>

    <script>
        const dogApi = 'https://dog.ceo/api/breeds/image/random';
        const catApi = 'https://api.thecatapi.com/v1/images/search';
        
        const imgElement = document.getElementById('pet-image');
        const loadingOverlay = document.getElementById('loading');

        async function loadPet(type) {
            // UI 초기화
            loadingOverlay.classList.remove('hidden');
            imgElement.classList.remove('loaded');

            let targetType = type;
            if (type === 'random') {
                targetType = Math.random() > 0.5 ? 'dog' : 'cat';
            }

            try {
                let imageUrl = '';
                if (targetType === 'dog') {
                    const res = await fetch(dogApi);
                    const data = await res.json();
                    imageUrl = data.message;
                } else {
                    const res = await fetch(catApi);
                    const data = await res.json();
                    imageUrl = data[0].url;
                }

                // 이미지 미리 로드하여 자연스럽게 표시
                const tempImg = new Image();
                tempImg.src = imageUrl;
                tempImg.onload = () => {
                    imgElement.src = imageUrl;
                    imgElement.classList.add('loaded');
                    loadingOverlay.classList.add('hidden');
                };
                tempImg.onerror = () => {
                    alert('사진을 불러오는데 실패했어요. 다시 시도해 주세요!');
                    loadingOverlay.classList.add('hidden');
                };

            } catch (error) {
                console.error('Fetch error:', error);
                alert('네트워크 연결을 확인해 주세요.');
                loadingOverlay.classList.add('hidden');
            }
        }

        // 페이지 진입 시 첫 사진 로드
        window.addEventListener('DOMContentLoaded', () => {
            loadPet('random');
        });
    </script>
</body>
</html>
